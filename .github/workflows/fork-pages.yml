name: Fork installer and editor
on:
  workflow_dispatch:
    inputs:
      drive_lab:
        description: Build the experimental drive-lab firmware
        type: boolean
        default: true
      blues_lab:
        description: Build both BlackBox blues-lab oversampling variants as artifacts
        type: boolean
        default: false
      publish:
        description: Publish the installer and editor on GitHub Pages (main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: '!inputs.blues_lab'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the pinned JieLi toolchain
        run: sh firmware/setup.sh
      - name: Build the V40 release channel
        run: |
          git worktree add --detach "$RUNNER_TEMP/openpocket-v40" de713b4da082c8afdb34bd25c55d66cfd6a95a8c
          (cd "$RUNNER_TEMP/openpocket-v40" && NATIVE=1 node tools/op.mjs package)
          cp "$RUNNER_TEMP/openpocket-v40"/docs/firmware/*.fwsc docs/firmware/
          cp "$RUNNER_TEMP/openpocket-v40"/docs/firmware/manifest.json docs/firmware/
      - name: Build the drive-lab channel
        if: inputs.drive_lab
        run: |
          OP_CHANNEL=drive-lab OP_TEST_VERSION=42 NATIVE=1 node tools/op.mjs build
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          const dir = 'docs/firmware/drive-lab/';
          const manifest = JSON.parse(readFileSync(dir + 'manifest.json'));
          for (const pkg of manifest.packages)
            if (pkg.model !== 'BlackBox') unlinkSync(dir + pkg.file);
          manifest.packages = manifest.packages.filter(pkg => pkg.model === 'BlackBox');
          writeFileSync(dir + 'manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          JS
      - name: Build the simulator engine
        if: inputs.drive_lab
        run: |
          if ! command -v wasm-ld >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y lld
          fi
          NATIVE=1 node tools/op.mjs wasm
      - name: Upload the drive-lab package and symbols
        if: inputs.drive_lab
        uses: actions/upload-artifact@v4
        with:
          name: drive-lab
          path: |
            docs/firmware/drive-lab/
            firmware/openpocket-drive-lab.bin
            firmware/build/symbols.txt
            tools/sim/px_engine.wasm
            tools/sim/px_engine.wasm.sources
          if-no-files-found: error
      - name: Configure TONE3000 on the fork
        if: inputs.publish && github.ref == 'refs/heads/main'
        env:
          TONE3000_CLIENT_ID: ${{ vars.TONE3000_CLIENT_ID }}
        run: |
          node --input-type=module - <<'JS'
          import { writeFileSync } from 'node:fs';
          const client = process.env.TONE3000_CLIENT_ID || '';
          if (client && !/^t3k_pub_[A-Za-z0-9_-]+$/.test(client))
            throw new Error('TONE3000_CLIENT_ID must be a publishable key');
          writeFileSync('docs/t3k-config.js', 'export default ' + JSON.stringify(client) + ';\n');
          JS
      - uses: actions/upload-pages-artifact@v4
        if: inputs.publish && github.ref == 'refs/heads/main'
        with:
          path: docs

  deploy:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  blues:
    if: inputs.blues_lab
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - channel: blues-lab
            version: 43
          - channel: blues-lab-4x
            version: 44
    env:
      OP_CHANNEL: ${{ matrix.channel }}
      OP_TEST_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned JieLi toolchain
        run: sh firmware/setup.sh
      - name: Build and verify the BlackBox package
        run: |
          NATIVE=1 node tools/op.mjs build
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync, unlinkSync } from 'node:fs';
          const dir = 'docs/firmware/' + process.env.OP_CHANNEL + '/';
          const manifest = JSON.parse(readFileSync(dir + 'manifest.json'));
          for (const pkg of manifest.packages)
            if (pkg.model !== 'BlackBox') unlinkSync(dir + pkg.file);
          manifest.packages = manifest.packages.filter(pkg => pkg.model === 'BlackBox');
          if (manifest.packages.length !== 1) throw new Error('Expected one BlackBox package');
          writeFileSync(dir + 'manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          JS
          sha256sum "firmware/openpocket-$OP_CHANNEL.bin" "docs/firmware/$OP_CHANNEL/"*.fwsc
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.channel }}
          path: |
            docs/firmware/${{ matrix.channel }}/
            firmware/openpocket-${{ matrix.channel }}.bin
            firmware/build/symbols.txt
          if-no-files-found: error
      - name: Rebuild the default simulator engine
        if: matrix.channel == 'blues-lab'
        run: |
          if ! command -v wasm-ld >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y lld
          fi
          NATIVE=1 node tools/op.mjs wasm
      - uses: actions/upload-artifact@v4
        if: matrix.channel == 'blues-lab'
        with:
          name: blues-default-simulator
          path: |
            tools/sim/px_engine.wasm
            tools/sim/px_engine.wasm.sources
          if-no-files-found: error
